name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: windows
            arch: amd64
          - os: ubuntu-latest
            plat: linux
            arch: amd64
          - os: macos-latest
            plat: macos
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tags
        uses: actions/checkout@v4

      - name: Setup Python an uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "latest"
          enable-cache: true
          python-version: '3.12'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install upx -y

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl patchelf python3-tk

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install upx

      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}

      - name: Build all
        env:
          NUITKA_ASSUME_YES_FOR_DOWNLOADS: "1"
        run: uv tool run --from poethepoet poe build-all

      - name: Rename artifact
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.plat }}-${{ matrix.arch }}
        run: |
          mkdir -p upload
          suffix="-${VERSION#v}-${TARGET}"
          if [ -f "build/GameSnap" ]; then
            mv build/GameSnap upload/GameSnap-${suffix}
          fi
          if [ -f "build/GameSnapCUI.exe" ]; then
            mv build/GameSnapCUI.exe upload/GameSnap-${suffix}.exe
          fi
          if [ -f "build/GameSnapGUI.exe" ]; then
            mv build/GameSnapGUI.exe upload/GameSnapGUI-${suffix}.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: upload/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
