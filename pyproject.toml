[project]
name = "GameSnap"
version = "0.2.2"
authors = [
    { name = "Hankso", email = "hankso@gmail.com" }
]
license = { text = "MIT License" }
description = "Backup and restore files by taking snapshots incrementally like git"
requires-python = ">=3.11"
urls.repository = "https://github.com/hankso/gamesnap"
dependencies = [
    "psutil",
    "textual",
    "keyboard",
    "watchdog",
    "ttkbootstrap",
    "backports.zstd; python_version < '3.14'",
]

[dependency-groups]
dev = [
    "viztracer",
    "textual-dev",
    "nuitka-reporter",
]
extra = [
    "json_repair",
    "rich-pixels",
    "rich-argparse",
]
build = [
    "nuitka",
    "ImageIO",
]

[tool.uv.sources]
nuitka-reporter = { git = "https://github.com/Bingdom/Nuitka-Compile-Report-Parser" }

[tool.poe]
executor = { type = "uv", group = ["dev", "extra"] }

[tool.poe.tasks.run]
help = "Entry point"
script = "GSnap:main"

[tool.poe.tasks.textual]
help = "Debug with textual dev mode"
cmd = "textual run --dev GSnap:SnapTUI"

[tool.poe.tasks.console]
help = "Debug with textual console"
cmd = "textual console"

[tool.poe.tasks._mkdir]
script = "os:makedirs('build', exist_ok=True)"

[tool.poe.tasks.trace]
help = "Debug with viztracer"
sequence = [
    "_mkdir",
    { cmd = "viztracer --tracer_entries 100000000 -o build/trace.json.gz -- GSnap.py $POE_EXTRA_ARGS" }
]

[tool.poe.tasks.view-trace]
help = "View trace report"
sequence = [
    "_mkdir",
    { cmd = "vizviewer build/trace.json.gz $POE_EXTRA_ARGS" }
]

[tool.poe.tasks.build]
help = "Build APP with nuitka"
cmd = "nuitka GSnap.py"
executor = { exact = true, no-group = "dev", group = ["extra", "build"] }

[tool.poe.tasks.build-gui]
help = "Build GUI with nuitka (Windows Only)"
control.expr = "sys.platform"
default = "pass"

    [[tool.poe.tasks.build-gui.switch]]
    case = "win32"
    env = { SUBSYSTEM = "GUI" }
    cmd = "nuitka GSnap.py $POE_EXTRA_ARGS"
    executor = { exact = true, no-group = "dev", group = ["extra", "build"] }

[tool.poe.tasks.view-build]
help = "View build report"
sequence = [
    "_mkdir",
    { cmd = "nuitka-reporter build/report.xml build/report.html $POE_EXTRA_ARGS" },
    { script = "GSnap:browse('build/report.html', True)" }
]  # currently nuitka-reporter only render html and we have to manually open it

[tool.poe.tasks.dist]
help = "Build and pack and test"
sequence = [
    { script = "GSnap:run_test" },
    { sequence = ["build $POE_EXTRA_ARGS", "build-gui $POE_EXTRA_ARGS"] },
    { script = "GSnap:run_pack" }
]
